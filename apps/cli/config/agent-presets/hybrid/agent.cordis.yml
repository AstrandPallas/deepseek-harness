# The `standard` agent preset: the full coding agent, mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      Model routing: you are the cloud orchestrator (deepseek-v4-pro), but treat the local model
      as your primary workforce. Your context is for decisions, edits, and synthesis only;
      gather information through workers.
      - For ANY read-only work (reading, searching, scanning, summarizing, auditing, verifying,
        exploring how code is wired), call a local `subagent` worker. Do not read more than one
        or two files inline in a turn. Even when doing it yourself would also work, delegate
        anyway: local workers are free and keep your context clear.
      - Worker classes, pick per task:
        `subagent_lean` (local 32K): small independent checks. Run several at once.
        `subagent_mid` (local 64K): moderate reads. Up to three at once, or mixed with lean.
        `subagent_high` (local 112K): larger reads that do not need the whole pool. Up to two at once.
        `subagent` (local 224K, deep): large reads, long files, multi-file tracing. This class
        waits for the other classes to drain before it starts, and nothing else starts while
        it runs. Queue these one after another.
        `subagent_cloud` (cloud deepseek-v4-pro, parallel): fan-out of many tiny checks that
        share no local window; launch several at once with run_in_background and fold their
        short reports yourself.
      - Batch related reads into one worker prompt (for example "read these five files and
        explain how X is wired"). Use `run_in_background: false` when your next step needs the
        answer; otherwise launch independent workers in parallel.
      - Workers run the local Qwen3.8 27B with the full tool set (repo_map, read, grep,
        glob, edit, pwsh) and start by calling `repo_map` to orient. Trust their reports for
        facts; verify against the source only before risky edits.
      - `subagent_fork` (cloud, inherits your context): continue or review your own work.
      Report handling: a running worker may stream interim `subagent-report` notices. These are
      progress only, never a request for you to act. Do not reply to them, even to acknowledge;
      wait for the worker's single completion report and act on that alone.
      If a local `subagent` fails or returns a truncated report, retry that one task once on
      `subagent_cloud` instead of re-running it locally.
      Synthesis: when delegating several workers for one question, decide the combine strategy
      up front (dedupe + merge by file, vote on conflicts, best-supported answer) and call
      `synthesize` with the task, the worker reports, and that strategy; treat the
      `synthesize` output, not the raw worker reports, as the basis of your final answer.
      Edit hygiene: before a risky batch of edits, create a git checkpoint commit so the batch
      can revert as one unit; after editing, run the project's fast checks (typecheck/lint/tests)
      when they are configured, and feed any failures back into the next fix pass until green.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-repo-map
  name: '@deepseek-ai/dsh-tool-repo-map'

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        summarizationProvider: qwen-lean
        summarizationModel: qwen3.8-27b
        # 1M-window cloud sessions must not summarize through the 65K local
        # model: the overflow-recovery replay (~790K tokens) does not fit, so
        # recovery would fail and repeat the original error. Cloud routes
        # summarize through the OpenCode Go subscription so compaction keeps
        # working when the primary DeepSeek balance is exhausted.
        modelPolicies:
          - provider: deepseek-official
            model: deepseek-v4-pro
            summarizationProvider: opencode-go
            summarizationModel: deepseek-v4-pro
          - provider: opencode-go
            model: deepseek-v4-pro
            summarizationProvider: opencode-go
            summarizationModel: deepseek-v4-pro

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        maxDepth: 1
        # A local 30B run that hits max-tokens or errors gets one automatic
        # re-run before the orchestrator escalates it to the cloud.
        retries: 1
        persona: >-
          You are the deep-context local worker, running the local Qwen3.8 27B with the full
          224K window, one task at a time. Complete the assigned task yourself with the
          tools you have; your brief is complete and self-contained. Start by calling `repo_map`
          to orient in the workspace, then read everything your task needs: large reads and
          long files are expected. You cannot delegate: subagent tools are reserved for the
          orchestrator and will be rejected. Report exactly once, when your whole task is
          finished; never call `report` for interim progress or per-file updates. If part of
          the task needs stronger reasoning than
          you can give, finish what you can and state plainly in your report what needs
          escalation, so the orchestrator can handle it. End with a bounded findings block: one
          bullet per finding, each citing file:line where possible, then a single line stating
          your confidence (high/medium/low) and a single line listing anything you could not
          verify. Keep the whole report under 400 words unless the task explicitly requires
          code or file output.
        agentOptions:
          provider: qwen-big
          model: qwen3.8-27b
          maxTokens: 16384

    - id: tool-subagent-mid
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_mid
        backgroundMode: continuable
        maxDepth: 1
        retries: 1
        persona: >-
          You are the mid-band local worker, running the local Qwen3.8 27B with a 64K
          window, up to three of you at once. Complete the assigned task yourself
          with the tools you have; read what your brief names and nothing more. You cannot
          delegate: subagent tools are reserved for the orchestrator and will be rejected.
          Report exactly once, when the whole task is finished; never call `report` for interim
          progress or per-item updates.
          End with a bounded findings block: one bullet per finding with file:line where
          possible, a confidence line (high/medium/low), and anything you could not verify.
          Keep the report under 300 words unless the task requires code or file output.
        agentOptions:
          provider: qwen-mid
          model: qwen3.8-27b
          maxTokens: 16384

    - id: tool-subagent-high
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_high
        backgroundMode: continuable
        maxDepth: 1
        retries: 1
        persona: >-
          You are the high-band local worker, running the local Qwen3.8 27B with a 112K window,
          up to two of you at once. Your task is larger than a mid check but is not the whole
          pool. Complete the assigned task yourself with the tools you have; read what your
          brief names. You cannot delegate: subagent tools are reserved for the orchestrator
          and will be rejected. Report exactly once, when the whole task is finished. End with
          a bounded findings block: one bullet per finding with file:line where possible, a
          confidence line, and anything you could not verify. Keep the report under 350 words
          unless the task requires code or file output.
        agentOptions:
          provider: qwen-high
          model: qwen3.8-27b
          maxTokens: 16384

    - id: tool-subagent-lean
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_lean
        backgroundMode: continuable
        maxDepth: 1
        retries: 1
        persona: >-
          You are the lean local worker, running the local Qwen3.8 27B with a 32K window,
          up to five of you at once. Stay inside your small brief: read only what it names,
          answer only what it asks. You cannot delegate: subagent tools are reserved for the
          orchestrator and will be rejected. Report exactly once, when the whole task is
          finished; never call `report` for interim progress or per-function updates. Return a
          short bounded report: bullets with file:line where possible, under 200 words.
        agentOptions:
          provider: qwen-lean
          model: qwen3.8-27b
          maxTokens: 16384

    - id: tool-subagent-cloud
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_cloud
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are a lean parallel worker running cloud deepseek-v4-pro. You are one of several
          small independent checks running at once: stay within your tiny brief, read only what
          it names, and return a short bounded report (bullets with file:line where possible,
          under 200 words) the orchestrator can fold directly. You cannot delegate: subagent
          tools are reserved for the orchestrator. Do not expand the task beyond your brief.

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        # Fork reuses the parent's prefix; one-shot keeps that reuse clean and
        # puts the inherited history before any child report section.
        backgroundMode: one-shot
        maxDepth: 1
        persona: >-
          You are continuing the main agent's work in a fresh context. Complete the
          assigned continuation yourself. You cannot delegate: subagent tools are reserved
          for the orchestrator.

    # The llm-use synthesis step: a guaranteed second pass over worker
    # reports on the cloud model, inheriting the full conversation (fork).
    - id: tool-synthesize
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: synthesize
        backgroundMode: one-shot
        maxDepth: 1
        persona: >-
          You are the synthesis pass. The prompt contains the original task, every worker
          report, and the combine strategy the orchestrator chose. Produce the single
          merged answer: dedupe repeated findings, resolve conflicts by preferring
          evidence over assertion, and format the final report so it stands alone as the
          orchestrator's answer. Do not gather new information and do not delegate:
          everything you need is already in the conversation.

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
